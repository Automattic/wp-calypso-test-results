<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
</head>
<body>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <script>
        if (window.location.pathname.startsWith('/wp-calypso-test-results/r/')) {
            document.title = 'Redirecting...';
            document.body.innerHTML = '<p>Redirecting...</p>';
            const path = window.location.pathname.replace('/wp-calypso-test-results/r/', '');
            const targetUrl = 'https://a8c-calypso-e2e-reports.s3.amazonaws.com/archive/' + path;
            window.location.href = targetUrl;
        }
    </script>
</body>
</html>
