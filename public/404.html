<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
</head>
<body>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist.</p>
    <script>
        if (window.location.pathname.startsWith('/wp-calypso-test-results/r/')) {
            document.title = 'Redirecting...';
            document.body.innerHTML = '<p>Redirecting...</p>';
            const path = window.location.pathname.replace('/wp-calypso-test-results/r/', '');
            
            // Validate path to prevent open redirect attacks
            if (path && /^[a-zA-Z0-9._/-]+$/.test(path) && !path.includes('..') && !path.startsWith('/')) {
                const targetUrl = 'https://a8c-calypso-e2e-reports.s3.amazonaws.com/archive/' + encodeURIComponent(path);
                window.location.href = targetUrl;
            } else {
                document.title = 'Invalid Path';
                document.body.innerHTML = '<h1>Invalid Path</h1><p>The requested path is invalid.</p>';
            }
        }
    </script>
</body>
</html>
